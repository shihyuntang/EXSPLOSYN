[main]
# --- Model resolution and parallel processing ---
grid            : 200    ; n; projected stellar disk grid, n x n pixels
nrho            : 100    ; nrho; sample points along each spot boundary
instrument_reso : 70000  ; R = lambda / FWHM; 0 disables instrumental broadening
cpu             : 2     ; Subprocess count for parallel surface integration

[star]
# --- Stellar parameters ---
radius            : 2.0     ; R_*; stellar radius in Rsun
prot              : 3.372   ; P_rot; rotation period in days
inclination_angle : 70      ; i_*; rotation-axis angle to the line of sight
                            ; degrees; 0 = pole-on, 90 = equator-on
Tphot             : 3670    ; T_phot; quiet photospheric temperature in K
logg              : 4.0     ; log g; log10 of surface gravity in cm/s^2
metallicity       : 0.0     ; [Fe/H]; metallicity in dex

[active_regions]
# --- Active regions on the stellar surface ---

# Each column defines one region; keep corresponding entries in the same order.
# When reordering regions, reorder all lists together, including Gaussian brightness.
# --- Temperature input: absolute temperatures (default) ---
temperature_mode : absolute
# l and b locate each circular region's geometric center.
# f_0 is the projected disk area percentage with the region at disk center.
# Each size must be <= 80%; larger regions are currently unsupported.
# Region              1       2       3       4
longitudes       :  310,    180,    352,     90   ; l; degrees
latitudes        :   64,     40,      5,     55   ; b; degrees
sizes            : 24.9,    8.7,   10.6,   15.8   ; f_0; percent
temperatures     : 3278,   3377,   3484,   3722   ; T_spot; K, rounded to integer Kelvin

# --- Alternative temperature input: offsets from T_phot ---
# Alternative: signed offsets from T_phot; relative is an alias for offset.
# temperature_mode    : offset
# temperature_offsets : -392,   -293,   -186,     52   ; T_spot - T_phot; K

# --- Alternative temperature input: lookup table ---
# Alternative: derive temperatures from labels and a temperature table.
# Labels follow the same region order as the columns above.
# temperature_mode   : t_lookup_table
# temperature_levels :    a,      b,      c,      d
# A filename alone uses configs/temperature_tables/ inside the code folder you run.
# Other paths start from your terminal folder, or use a full path.
# temperature_table  : temperature_table_lkca4_demo.ini

[spectroscopic]
# --- Spectroscopic bands and their sources ---
# phx_rv uses [phx_rv]; other names select matching [band:NAME] sections.
# Built-in choices: phx_rv, gaussian; external-library example: FeOH.
# Separate names with commas. Unlisted spectroscopic sections are inactive.
# Photometry is currently controlled separately by [photometry] filters.
enabled : phx_rv

[phx_rv]
# --- PHOENIX RV bands ---
# Required PHOENIX flux spectra can be downloaded automatically.
# Wavelength centers, spacing and window half-width are in Angstroms.
wavelength_start  : 15400
wavelength_end    : 15801
wavelength_step   : 200
window_half_width : 100

[band:gaussian]
# --- Analytic Gaussian line profile ---
# Add gaussian to [spectroscopic] enabled to simulate this profile.
# The local line is generated analytically; RV uses its first moment, without CCF.
source              : gaussian_profile
center              : 17500.0  ; Angstroms
velocity_half_range : 80.0     ; km/s
velocity_step       : 0.3      ; km/s
doppler_width       : 3.4      ; km/s; Gaussian width parameter
line_depth          : 0.5      ; depth relative to the local continuum

# One relative brightness per region, in [active_regions] coordinate order.
# Quiet surface = 1; 0 = dark; values above 1 = brighter than quiet.
# Gaussian uses brightness and ignores active-region temperatures and
# black_below_temperature. PHOENIX/SYNMAST still use those temperature inputs.
# Photospheric temperature is used for Gaussian limb-darkening coefficients.
brightness          : 0.7, 0.8, 0.9, 1.2

# --- External spectral-library bands (SYNMAST) ---
# Obtain the FeOH library separately and set its directory in [paths].
# library_path names a [paths] key, not a directory.
# Add FeOH to [spectroscopic] enabled to run this band.
[band:FeOH]
# Center and window half-width are in Angstroms.
source            : synmast
spectrum_mode     : intensity  ; intensity or flux; both use unnormalized spectra
library_path      : synmast_feoh
center            : 15557.0
window_half_width : 94.0
# ewr_FeOH measures the OH/Fe equivalent-width ratio; supported only in [band:FeOH].
diagnostics       : ewr_FeOH, rv

[photometry]
# --- Photometric filters ---
# Select photometric filters by their SVO identifiers:
# https://svo2.cab.inta-csic.es/theory/fps/
# Separate multiple filters with commas; spaces around commas are allowed.
# Leave empty or use None to disable photometry.
# filters : TESS/TESS.Red, SLOAN/SDSS.z, 2MASS/2MASS.J
filters : TESS/TESS.Red, SLOAN/SDSS.z, 2MASS/2MASS.Ks

[rv_ccf]
# --- Radial velocities from cross-correlation (CCF) ---
# Search RV shifts between -rv_half_range and +rv_half_range.
rv_half_range            : 40 ; km/s

# Reference spectrum used to calculate the CCF.
# phx (PHOENIX flattened flux) is the default RV template.
template_source          : phx
# PHOENIX template temperature; ignored for file templates.
template_use_photosphere : 0    ; 1 uses [star] Tphot; 0 uses template_temperature
template_temperature     : 3800 ; 2500–10000 K; used only when template_use_photosphere is 0

# --- Optional RV CCF template from a file ---
# For a custom disk-spectrum template, use template_source : file.
# Use .npz arrays: wavelength_angstrom (vacuum Angstroms) and flux (continuum-normalized).
# Paths are relative to this config file; include wavelength margins for RV shifts.
# template_file : ../data/templates/my_template.npz
# Additional broadening for file templates only; 0 keeps the supplied profile.
# template_rotation_vel : 0 ; km/s (v sin i)
# template_resolution : 0   ; resolving power (lambda / FWHM)

[phase_sampling]
# --- Rotation phases to simulate ---
# Phases are in cycles; regular sampling spans approximately -0.75 to +0.75.
# Providing a phase_file overrides phase_step; its first column contains the phases.
# Relative phase-file paths are resolved from the working directory.
phase_step : 0.025  ; Phase spacing in cycles; used when phase_file is empty or None
phase_file :
# phase_file : configs/phases/phases.txt

[output]
# --- Output options ---
make_plots         : 1   ; Summary PDFs and continuum-fitting plots; ignored in fitting/debug modes
make_gif_animation : 1   ; Phase animation in addition to any requested PDFs
save_spectra       : 1   ; Final spectra and CCF templates in the results folder; ignored in fitting/debug modes
# Results: output_root/run_name; relative paths start from your terminal folder.
# --paths NAME adds _NAME to run_name; --output-dir PATH uses PATH directly.
output_root        : outputs
run_name           : demo

[paths]
# --- Spectral-library and RASSINE directories ---
# Relative paths are resolved from the working directory; ~ is supported.
phoenix_root           : ~/PHOENIX-ACES-AGSS-COND-2011
phoenix_intensity_root : ~/.ldtk/cache_visir-lowres
rassine_root           : ./external/Rassine_public
# Replace /path/to with the directory where you keep the downloaded library.
synmast_feoh           : /path/to/FeOH_synmast1.9_marcs_spirou_demo

# =============================================================================
# ADVANCED SETTINGS — OPTIONAL
# Keep the defaults below for typical use; no changes are required.
# Adjust only when exploring optional physics or checking numerical convergence.
# =============================================================================

[advanced]
# --- SYNMAST magnetic fields ---
# SYNMAST magnetic-field strengths in Gauss; PHOENIX does not use these.
# Leave either field empty to use 0 G.
# All emitting active regions share active_B. If any region has the same
# temperature as the photosphere, active_B must equal photosphere_B.
photosphere_B                   : 0
active_B                        : 0

# --- Optional zero-emission approximation ---
# Approximate regions below this temperature as non-emitting.
# Applied after rounding region temperatures to integer Kelvin.
# Leave empty to disable. Equality does not trigger the approximation.
black_below_temperature         :

# --- Numerical sampling ---
# For small RV signals, test mock sampling first (14 -> 28), then template
# sampling (5 -> 10), and refine the CCF step last. Check RV convergence.
# Finer sampling increases runtime and may increase memory use.

# Internal velocity-grid samples per instrumental FWHM, not resolving power.
spec_oversample_factor          : 14

# Minimum template sample count relative to the mock spectrum in the band.
# The default 5 gives approximately five template samples per mock sample pixel.
# Already denser input templates are retained; extra samples use interpolation.
ccf_template_oversample_factor  : 5

# CCF fine velocity step = mock spectrum velocity step / this factor.
# The default 50 gives about 6.12 m/s at R=70000 and spec_oversample_factor=14.
# Increasing this factor refines the RV search grid, not the spectral resolution.
ccf_rv_oversample_factor        : 50

# =============================================================================
# OPTIONAL PATH PROFILE EXAMPLE
# =============================================================================
# [paths:NAME] overrides only the entries listed here; others use [paths].
# Replace these example directories with your own before selecting this profile.
# Example: python main.py --config demo --paths demo
# Without --paths, this section is inactive.
# A band library_path key is resolved from these merged path settings.
[paths:demo]
phoenix_root : /data/PHOENIX-ACES-AGSS-COND-2011
rassine_root : /tools/Rassine_public
