# Performance benchmark: fixed-temperature forward models, protocol v3.
# Physics follows demo.cfg, with a fifth region at an existing temperature.
# Run from the checkout with: python benchmark.py
# The script selects each observable separately and uses fitting mode.

[main]
grid            : 200
nrho            : 100
instrument_reso : 70000
cpu             : 1       ; The script compares 1 and 4 processes; --workers selects one count.

[star]
radius            : 2.0
prot              : 3.372
inclination_angle : 70
Tphot             : 3670
logg              : 4.0
metallicity       : 0.0

[active_regions]
temperature_mode : absolute
# Region               1       2       3       4       5
longitudes       :   310,    180,    352,     90,    240
latitudes        :    64,     40,      5,     55,    -20
sizes            :  24.9,    8.7,   10.6,   15.8,    8.0
# The fifth region reuses 3278 K; no additional spectral temperature is needed.
temperatures     :  3278,   3377,   3484,   3722,   3278

[spectroscopic]
# The script selects only phx_rv or FeOH, or neither for photometry.
enabled : phx_rv, FeOH

[phx_rv]
# One 200-Angstrom window centered at 15400 Angstroms.
wavelength_start  : 15400
wavelength_end    : 15401
wavelength_step   : 200
window_half_width : 100

[band:FeOH]
source            : synmast
spectrum_mode     : intensity
library_path      : synmast_feoh
center            : 15557
window_half_width : 94
diagnostics       : ewr_FeOH, rv

[photometry]
filters : TESS/TESS.Red

[rv_ccf]
rv_half_range            : 40
template_source          : phx
template_use_photosphere : 0
template_temperature     : 3800

[phase_sampling]
# Fixed 100 phases in [0, 1), identical for every evaluation.
phase_step :
phase_file : configs/phases/phases_benchmark.txt

[output]
# Benchmark reports are separate; model CSVs, plots and spectra are disabled.
make_plots         : 0
make_gif_animation : 0
save_spectra       : 0
save_folder_name   : benchmark

[paths]
# The script normally reuses [paths] from demo.cfg (PHX/photometry)
# or demo_lkca4.cfg (FeOH); these defaults also permit direct cfg use.
phoenix_root           : ~/PHOENIX-ACES-AGSS-COND-2011
phoenix_intensity_root : ~/.ldtk/cache_visir-lowres
rassine_root           : ./external/Rassine_public
# The FeOH case is skipped if this library is unavailable.
synmast_feoh           : /path/to/FeOH_synmast1.9_marcs_spirou_demo

[advanced]
photosphere_B                  : 0
active_B                       : 0
black_below_temperature         :
spec_oversample_factor          : 14
ccf_template_oversample_factor  : 5
ccf_rv_oversample_factor        : 50
